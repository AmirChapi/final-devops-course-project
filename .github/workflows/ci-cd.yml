name: CI-CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint

      - name: Run pylint
        run: |
          pylint app.py

      - name: Run tests (optional)
        run: |
          if [ -d "tests" ]; then
            pip install pytest
            pytest -q
          else
            echo "No tests/ directory found, skipping pytest."
          fi

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t local/final-app:${{ github.sha }} .

  deploy:
    name: Deploy to Kubernetes (kind) with Helm
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Create kind cluster
        run: |
          kind create cluster --name ci-cluster
          kubectl cluster-info

      - name: Build image for deploy
        run: |
          docker build -t local/final-app:${{ github.sha }} .

      - name: Load image into kind
        run: |
          kind load docker-image local/final-app:${{ github.sha }} --name ci-cluster

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Helm lint + deploy
        run: |
          helm lint ./helm/final-app
          helm upgrade --install final-app ./helm/final-app \
            --set image.repository=local/final-app \
            --set image.tag=${{ github.sha }}

      - name: Verify rollout
        run: |
          kubectl get pods
          kubectl rollout status deployment/final-app-deployment --timeout=180s
          kubectl get svc
