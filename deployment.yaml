apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: final-app
  template:
    metadata:
      labels:
        app: final-app
    spec:
      containers:
        - name: final-app-container
          image: amirchapi/final-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: final-app-config
            - secretRef:
                name: final-app-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
