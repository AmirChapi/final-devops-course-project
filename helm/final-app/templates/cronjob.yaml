{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: final-app-cron
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: curl
              image: curlimages/curl:8.6.0
              args:
                - /bin/sh
                - -c
                - "curl -fsS {{ .Values.cronjob.url }} >/dev/null"
          restartPolicy: OnFailure
{{- end }}
