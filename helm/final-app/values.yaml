replicaCount: 1

image:
  repository: amirchapi/final-app
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 5000
  targetPort: 5000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

config:
  APP_ENV: production
  LOG_LEVEL: info

secret:
  APP_SECRET_KEY: "dummy-secret-for-lint"

probes:
  path: /
  port: 5000
  readinessInitialDelaySeconds: 5
  livenessInitialDelaySeconds: 10

cronjob:
  enabled: true
  schedule: "*/5 * * * *"
  url: "http://final-app-service:5000/"
